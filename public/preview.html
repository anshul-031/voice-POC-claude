<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AnshulTheGreat.com public web call preview with live transcription">
  <title>AnshulTheGreat.com Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script type="importmap">
    {
      "imports": {
        "zod": "https://esm.sh/zod@4.3.6"
      }
    }
  </script>
</head>
<body>
  <header id="app-header">
    <div class="header-content">
      <div class="logo">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </div>
        <h1 data-i18n="header.title">AnshulTheGreat.com</h1>
      </div>
      <div class="header-status">
        <div class="status-dot connected"></div>
        <span data-i18n="preview.subtitle">Test call quality and view live transcription</span>
      </div>
    </div>
  </header>

  <main id="app-main" style="grid-template-columns: 1fr; max-width: 1080px;">
    <section class="panel detail-panel" id="detail-panel">
      <div class="call-panel" id="call-panel"></div>
    </section>
  </main>

  <div class="toast-container" id="toast-container"></div>

  <script type="module" src="/js/runtimeBootstrap.js"></script>
  <script type="module" src="/js/preview.js"></script>
</body>
</html>
