<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Set a new password for your AnshulTheGreat.com account.">
  <title>Reset Password — AnshulTheGreat.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <!-- Nav -->
  <nav class="auth-nav">
    <a href="/" class="logo">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </div>
      <span class="logo-text">AnshulTheGreat.com</span>
    </a>
  </nav>

  <!-- Reset Password Card -->
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-card-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h1>Set new password</h1>
        <p>Choose a strong password for your account</p>
      </div>

      <div class="auth-message" id="auth-message"></div>

      <form class="auth-form" id="reset-form">
        <div class="auth-field">
          <label for="reset-password">New Password</label>
          <div class="input-wrapper">
            <input type="password" id="reset-password" placeholder="Min. 8 characters" required autocomplete="new-password">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <div class="password-strength">
            <div class="password-strength-bar" id="strength-bar"></div>
          </div>
          <span class="password-strength-text" id="strength-text"></span>
        </div>

        <div class="auth-field">
          <label for="reset-confirm">Confirm New Password</label>
          <div class="input-wrapper">
            <input type="password" id="reset-confirm" placeholder="Re-enter new password" required autocomplete="new-password">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </div>
        </div>

        <button type="submit" class="auth-submit" id="reset-btn">
          <span class="btn-text">Reset Password</span>
          <div class="spinner"></div>
        </button>
      </form>

      <div class="auth-links">
        <p>Remembered your password? <a href="/login">Sign in</a></p>
      </div>
    </div>
  </div>

  <script type="module" src="/js/runtimeBootstrap.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
