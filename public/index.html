<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Voice Agent Creation Platform — Create, configure, and test voice agents powered by Gemini Live API">
  <title data-i18n="header.title">AnshulTheGreat.com — AI Voice Agent Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "zod": "https://esm.sh/zod@4.3.6"
      }
    }
  </script>
</head>
<body>
  <!-- Header -->
  <header id="app-header">
    <div class="header-content">
      <div class="logo">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </div>
        <h1 data-i18n="header.title">AnshulTheGreat.com</h1>
      </div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <div class="header-status">
          <div class="status-dot" id="api-status"></div>
          <span id="api-status-text" data-i18n="header.apiStatus.checking">Checking API...</span>
        </div>
        <div class="user-menu" id="user-menu" style="display: none;">
          <button class="btn btn-ghost user-menu-btn" id="user-menu-btn" style="display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 100px; background: rgba(124, 58, 237, 0.1); border: 1px solid rgba(124, 58, 237, 0.2);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span id="user-name" style="font-size: 0.82rem; color: #c4b5fd; font-weight: 500;"></span>
          </button>
          <button class="btn btn-ghost" id="btn-logout" style="font-size: 0.8rem; color: #a0a0c0;" title="Logout">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="app-main">
    <!-- Left Panel: Agent Management -->
    <section class="panel agent-panel" id="agent-panel">
      <div class="panel-header">
        <h2 data-i18n="agentList.title">Voice Agents</h2>
        <button class="btn btn-primary btn-glow" id="btn-new-agent">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span data-i18n="agentList.newAgent">New Agent</span>
        </button>
      </div>

      <!-- Agent List -->
      <div class="agent-list" id="agent-list">
        <div class="loading-skeleton">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>
    </section>

    <!-- Right Panel: Agent Form / Call Panel -->
    <section class="panel detail-panel" id="detail-panel">
      <!-- Empty State -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </div>
        <h3 data-i18n="emptyState.title">Create Your First Voice Agent</h3>
        <p data-i18n="emptyState.description">Configure an AI voice agent with a custom personality, system prompt, and voice. Test it with a live call right in your browser.</p>
      </div>

      <!-- Create/Edit Form -->
      <div class="agent-form-container hidden" id="agent-form-container">
        <div class="form-header">
          <h2 id="form-title" data-i18n="form.createTitle">Create New Agent</h2>
          <button type="button" class="btn btn-ghost" id="btn-close-form">
        </div>
        <form id="agent-form">
          <input type="hidden" id="form-agent-id" value="">
          
          <div class="form-group">
            <label for="form-name" data-i18n="form.nameLabel">Agent Name</label>
            <input type="text" id="form-name" data-i18n-attr="placeholder:form.namePlaceholder" placeholder="e.g. Customer Support Bot" required>
          </div>

          <div class="form-group">
            <label for="form-voice" data-i18n="form.voiceLabel">Voice</label>
            <div class="voice-grid" id="voice-grid">
              <!-- Voice options loaded dynamically -->
            </div>
          </div>

          <div class="form-group">
            <label for="form-model" data-i18n="form.modelLabel">Gemini Live Model</label>
            <select id="form-model" class="form-select">
              <!-- Model options loaded dynamically -->
            </select>
          </div>

          <div class="form-group">
            <label for="form-prompt" data-i18n="form.promptLabel">System Prompt</label>
            <textarea id="form-prompt" rows="6" data-i18n-attr="placeholder:form.promptPlaceholder" placeholder="You are a helpful customer support agent for Acme Corp. Be friendly, professional, and concise in your responses..." required></textarea>
          </div>

          <div class="form-group">
            <label class="checkbox-row" for="form-public-preview-enabled">
              <input type="checkbox" id="form-public-preview-enabled">
              <span data-i18n="form.publicPreviewLabel">Enable public preview URL</span>
            </label>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-ghost" id="btn-cancel-form" data-i18n="common.cancel">Cancel</button>
            <button type="submit" class="btn btn-primary btn-glow" id="form-submit-btn">
              <span id="form-submit-text" data-i18n="common.create">Create Agent</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Call Panel -->
      <div class="call-panel hidden" id="call-panel"></div>
    </section>
  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script type="module" src="/js/runtimeBootstrap.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
